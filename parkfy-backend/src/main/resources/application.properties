# Configs basicas do projeto:

spring.application.name=ParkyfiBackend
server.port=8081
server.servlet.context-path=/v1/api

# Le as variaveis do .env (o mesmo usado pelo docker-compose), se o arquivo existir
spring.config.import=optional:file:.env[.properties]

# Configuracoes de banco de dados:

spring.datasource.url=jdbc:postgresql://localhost:${DB_PORT:5432}/${DB_NAME:parkfy_db_dev}
spring.datasource.username=${DB_USERNAME:joao}
spring.datasource.password=${DB_PASSWORD:adm123}

# Configuracoes Hibernate:

# Esta configuracao faz com que o hibernate atualize o banco de dados de acordo com as entidades do Projeto
# Manter update para desenvolvimento, mas apos terminar os testes voltar para none
spring.jpa.hibernate.ddl-auto=none

# Boa pratica manter open in view desligado
# Isso garante que a aplicacao rode sem sessoes do banco serem abertas automaticamente
# As sessoes so sao abertas via Codigo @Transactional
spring.jpa.open-in-view=false

# CONFIGURACOES SWAGGER:

springdoc.swagger-ui.path=/swagger-ui.html



